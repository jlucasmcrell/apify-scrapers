# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
#
# This server is a stdlib-only Python stdio server published to PyPI as
# apify-data-scrapers. It calls the user's OWN Apify account. The token field is
# declared optional (it may already be in the environment; discovery works
# keyless); a keyless tool call returns an error that says where to get one.

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    properties:
      apifyToken:
        type: string
        description: >-
          Apify API token from https://console.apify.com/settings/integrations.
          Runs execute on the caller's own Apify account and are billed to it.
  commandFunction:
    # A function that produces the CLI command to start the MCP on stdio.
    |-
    (config) => ({
      "command": "python",
      "args": ["-m", "mcp_server"],
      "env": { "APIFY_TOKEN": config.apifyToken }
    })
