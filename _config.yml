# GitHub Pages (Jekyll) metadata for https://apify.revenuesystemslabs.com/ - the README is the site.
title: Apify Public Data MCP
tagline: 33 public-data tools for AI agents
description: Run 33 public-data tools for leads, jobs, SEC filings, procurement, sanctions, recalls, health, registries, and media through one MCP server.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
url: https://apify.revenuesystemslabs.com
exclude:
  - build
  - dist
  - "*.egg-info"
  - __pycache__
  - scripts
  - Dockerfile
  - setup.py
  - package.json
  - server.json
  - manifest.json
  - smithery.yaml
  - glama.json
  - requirements.txt
