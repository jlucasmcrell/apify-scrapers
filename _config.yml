# GitHub Pages (Jekyll) metadata for https://apify.revenuesystemslabs.com/ - the README is the site.
title: Apify Public Data MCP
tagline: 39 public-data tools for AI agents
description: Run 39 public-data tools for leads, jobs, SEC filings, procurement, recalls, health, registries, and media through one MCP server.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
url: https://apify.revenuesystemslabs.com
# Traffic measurement. GoatCounter is LIVE as of 2026-09-18: the site code below
# resolves and accepts hits (verified: the beacon endpoint returns 200 for this
# code and 400 for a code that does not exist). The snippet lives in
# _includes/head-custom.html, which the theme already includes on every page.
# Cookie-less, no personal data, no consent banner required.
# Swapping provider later is a two-line change; "" for id switches it back off.
analytics:
  provider: "goatcounter"
  id: "revenuesystemslabs"
exclude:
  - build
  - dist
  - "*.egg-info"
  - __pycache__
  - scripts
  - Dockerfile
  - setup.py
  - package.json
  - server.json
  - manifest.json
  - smithery.yaml
  - glama.json
  - requirements.txt
  - specs
  - tests
  - MANIFEST.in
  # HF dataset cards: the canonical page is the Hugging Face card, and as site
  # pages they were thin duplicates that only existed at /README.html.
  - datasets/*/README.md
  - articles/reddit_community_responses.md
  - templates/google_sheets_lead_machine/gumroad_listing_copy.md
