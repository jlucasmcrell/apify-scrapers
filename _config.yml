# GitHub Pages (Jekyll) metadata for https://apify.revenuesystemslabs.com/ - the README is the site.
title: Apify Public Data MCP
description: 30 production public-data scrapers - leads, jobs, SEC filings, procurement, sanctions, recalls, health data, company registries and media - as one MCP server; each runs as an Apify Actor on your own account.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
url: https://apify.revenuesystemslabs.com
exclude:
  - build
  - dist
  - "*.egg-info"
  - __pycache__
  - scripts
  - Dockerfile
  - setup.py
  - package.json
  - server.json
  - manifest.json
  - smithery.yaml
  - glama.json
  - requirements.txt
