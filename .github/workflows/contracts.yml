name: Public contracts
on: [push, pull_request]
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/site/lint_pages.py
      - run: python -m compileall -q mcp_server.py scripts examples
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check examples/google_maps_leads.js
      - run: node --check examples/sec_filings.js
