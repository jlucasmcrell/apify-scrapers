[project]
name = "apify-public-data-arcade"
version = "1.0.0"
description = "Six read-only public-data tools backed by the Apify Public Data Fleet"
requires-python = ">=3.10"
dependencies = [
    "arcade-mcp-server>=1.30.1,<2",
]

[project.entry-points.arcade_toolkits]
apify_public_data = "apify_public_data"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apify_public_data"]
